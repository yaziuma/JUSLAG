name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --frozen --extra dev

      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.py')
          if (( ${#files[@]} )); then
            uv run --frozen --extra dev ruff check "${files[@]}"
          fi

      - name: Run hermetic test suite
        env:
          HOME: ${{ runner.temp }}/juslag-home
        run: |
          mkdir -p "$HOME"
          uv run --frozen --extra dev pytest -q
