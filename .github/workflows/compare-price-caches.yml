name: compare-price-caches

on:
  workflow_dispatch:
    inputs:
      left_key:
        description: "Earlier exact Actions Cache key"
        type: string
        required: true
      right_key:
        description: "Later exact Actions Cache key"
        type: string
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Restore earlier price cache
        id: left
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.juslag/prices.db
          key: ${{ inputs.left_key }}
      - name: Move earlier cache
        run: |
          test "${{ steps.left.outputs.cache-hit }}" = "true"
          test -s ~/.juslag/prices.db
          mv ~/.juslag/prices.db /tmp/juslag-prices-left.db
      - name: Restore later price cache
        id: right
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.juslag/prices.db
          key: ${{ inputs.right_key }}
      - name: Compare cached prices
        run: |
          test "${{ steps.right.outputs.cache-hit }}" = "true"
          test -s ~/.juslag/prices.db
          uv run --frozen python scripts/ops/compare_price_caches.py \
            --left /tmp/juslag-prices-left.db --right ~/.juslag/prices.db
