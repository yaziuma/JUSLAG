name: opening-bars

on:
  schedule:
    # JP weekdays 09:16 and 09:40 JST (UTC 00:16 and 00:40)
    - cron: "16,40 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: opening-bars
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Capture opening bars
        run: uv run --frozen python scripts/ops/capture_intraday.py --period 1d --db "$RUNNER_TEMP/juslag-opening.sqlite" --snapshot-dir data/opening_bars

      - name: Evaluate frozen A2/A3 gates
        run: |
          PYTHONPATH=src uv run --frozen python scripts/reports/check_a_evaluation_gate.py > "$RUNNER_TEMP/a-gate.json"
          {
            echo "## A2/A3 frozen gate"
            echo
            echo '| Gate | Progress | Ready |'
            echo '| --- | ---: | --- |'
            jq -r '"| A2 timely proxy sessions | \(.a2_proxy.complete_sessions)/\(.a2_proxy.minimum_complete_sessions) | \(.a2_proxy.ready) |"' "$RUNNER_TEMP/a-gate.json"
            jq -r '"| A3 untouched JPX sessions | \(.a3_holdout.completed_sessions)/\(.a3_holdout.expected_sessions) | \(.a3_holdout.ready) |"' "$RUNNER_TEMP/a-gate.json"
            echo
            jq -r '"Decision: **\(.decision)** / live trading allowed: **\(.live_trading_allowed)**"' "$RUNNER_TEMP/a-gate.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit observed bars
        run: |
          if [ ! -d data/opening_bars ]; then
            echo "No bars from today's JP opening window"
            exit 0
          fi
          git add data/opening_bars/
          if git diff --cached --quiet; then
            echo "No new observed bars"
            exit 0
          fi
          git -c user.name="juslag-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "data: capture JP opening bars [skip ci]"
          git pull --rebase
          git push
